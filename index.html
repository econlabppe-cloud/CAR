<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo} = React;
const ILS  = String.fromCharCode(8362);
const fmt  = n => Math.round(Math.abs(n)).toLocaleString('he-IL') + ' ' + ILS;
const fmtS = n => { const r=Math.round(n); if(!r) return '0 '+ILS; return (r>0?'+':'-')+Math.abs(r).toLocaleString('he-IL')+' '+ILS; };
const toN  = s => parseFloat(s)||0;

/* החזרים קבועים דרגה ד' */
const ALLOW_676  = 676;
const ALLOW_387  = 387;
const ALLOW_340B = 340;

const TRAVEL_OPTIONS = [
  {label:'קצר',    sub:'עד 20 ק"מ',    val:323},
  {label:'בינוני', sub:'20–40 ק"מ',   val:464},
  {label:'רחוק',   sub:'מעל 40 ק"מ',  val:684},
];

const ENGINES = {
  electric:      {label:'חשמלי (BEV)',           emoji:'🔋', val:1380},
  plugin_hybrid: {label:'היברידי נטען (PHEV)',    emoji:'🔌', val:1150},
  mild_hybrid:   {label:'היברידי (HEV)',           emoji:'⚡', val:580 },
  petrol:        {label:'בנזין',                  emoji:'⛽', val:0   },
};

/* עלות אנרגיה לק"מ לפי סוג מנוע פרטי */
const FUEL_COST_PER_KM = {
  electric:      {min:0.10, max:0.13, mid:0.115, label:'10–13 אג׳ (חשמל)'},
  plugin_hybrid: {min:0.15, max:0.21, mid:0.18,  label:'15–21 אג׳ (PHEV טעון)'},
  mild_hybrid:   {min:0.28, max:0.37, mid:0.325, label:'28–37 אג׳ (HEV)'},
  petrol:        {min:0.45, max:0.61, mid:0.53,  label:'45–61 אג׳ (בנזין)'},
};

const TAXES = [
  {label:'20% | עד 7,500',                    v:0.20},
  {label:'29% | 7,500–16,000',                v:0.29},
  {label:'43% | 16,000–22,000',               v:0.43},
  {label:'47% | 22,000–45,000 (ברירת מחדל)', v:0.47},
  {label:'59% | 45,000–49,000 (פסגת ההר)',   v:0.59},
  {label:'50% | מעל 49,000',                  v:0.50},
];


/* ירידת ערך — 5 מדרגות עם רצפת שווי */
function autoDepPct(val) {
  if (val >= 150000) return 1.25;
  if (val >= 80000)  return 0.85;
  if (val >= 30000)  return 0.55;
  if (val >= 5000)   return 0.25;
  return 0;
}
function depLabel(val) {
  if (val >= 150000) return 'ירידה מהירה (1.25%/חודש)';
  if (val >= 80000)  return 'ירידה בינונית (0.85%/חודש)';
  if (val >= 30000)  return 'ירידה איטית (0.55%/חודש)';
  if (val >= 5000)   return 'דעיכה עמוקה (0.25%/חודש)';
  return 'רצפת שווי — אין ירידה';
}
function depColor(val) {
  if (val >= 150000) return '#dc2626';
  if (val >= 80000)  return '#d97706';
  if (val >= 30000)  return '#65a30d';
  return '#16a34a';
}

/* טיפולים לפי שווי + סוג מנוע */
function maintPerKm(val, engineType) {
  if (engineType === 'electric') {
    return val >= 150000 ? 0.08 : 0.10;
  }
  if (val >= 140000) return 0.15;
  if (val >= 70000)  return 0.20;
  return 0.27;
}
function maintLabel(val, engineType) {
  if (engineType === 'electric') return val >= 150000 ? '8 אג\' (EV חדש)' : '10 אג\' (EV)';
  if (val >= 140000) return '15 אג\' (חדש/יקר)';
  if (val >= 70000)  return '20 אג\' (בינוני)';
  return '27 אג\' (ישן)';
}

function Inp({val, set, nopre, pct, step='any', min=0}) {
  return (
    <div className="inp-w">
      {!nopre && !pct && <span className="sym">{ILS}</span>}
      {pct && <span className="sym-r">%</span>}
      <input type="number" step={step} min={min}
        className={'inp'+(nopre?' nopre':pct?' pct':'')}
        value={val}
        onChange={e => set(e.target.value)}
        onBlur={e => { if(e.target.value===''||e.target.value==='-') set('0'); }}
      />
    </div>
  );
}

function App() {
  const [tab,     setTab]     = useState('sim');
  const [tax,     setTax]     = useState(0.47);

  /* רכב צמוד */
  const [listPrice, setListPrice] = useState('170000');
  const [compCarType, setCompCarType] = useState('electric');
  const [privCarType, setPrivCarType] = useState('electric');

  /* רכב פרטי */
  const [currentVal,  setCurrentVal]  = useState('120000');
  const [annualKm,    setAnnualKm]    = useState('18000');
  const [travelOpt,   setTravelOpt]   = useState(1);

  /* עלות הון */
  const [equityPct, setEquityPct] = useState(50);
  const [loanRate,  setLoanRate]  = useState('4');
  const [altRate,   setAltRate]   = useState('4');

  /* שקלול רכב שני וק"מ בונוס */
  const [hasSecondCar,    setHasSecondCar]    = useState(false);
  const [secondCarKm,     setSecondCarKm]     = useState('5000');   /* ק"מ שנתי מהרכב השני */
  const [bonusKmPct,      setBonusKmPct]      = useState(12);       /* % ק"מ בונוס ברכב צמוד */

  const c = useMemo(() => {
    const listN   = toN(listPrice);
    const curValN = toN(currentVal);
    const annKm   = toN(annualKm);
    const loanR   = toN(loanRate);
    const altR    = toN(altRate);
    const eqPct   = equityPct / 100;
    const secondCarKmN = toN(secondCarKm);
    const monthKm = annKm / 12;

    /* ===== רכב צמוד ===== */
    const shovi    = Math.max(0, listN * 0.0248 - ENGINES[compCarType].val);
    const compCost = shovi * tax;

    /* ===== החזרים — רק ברכב פרטי ===== */
    const allow676net  = ALLOW_676;
    const allow387net  = ALLOW_387;
    const allow340net  = ALLOW_340B * (1 - tax);
    const travelNet    = TRAVEL_OPTIONS[travelOpt].val;
    const totalAllowNet = allow676net + allow387net + allow340net + travelNet;

    /* ===== עלויות רכב פרטי — ללא ביטוח/אגרה (מגולם) ===== */
    const fuelPerKm    = FUEL_COST_PER_KM[privCarType] ? FUEL_COST_PER_KM[privCarType].mid : 0.53;
    const fuelMonthly  = monthKm * fuelPerKm;

    /* טיפולים — לפי שווי וסוג מנוע */
    const mPerKm       = maintPerKm(curValN, privCarType);
    const maintMonthly = monthKm * mPerKm;

    /* ירידת ערך */
    const depPct       = autoDepPct(curValN);
    const depMonthly   = curValN * depPct / 100;

    /* עלות הון */
    const loanAmt   = curValN * (1 - eqPct);
    const equityAmt = curValN * eqPct;
    const loanCost  = loanAmt   * (loanR / 100) / 12;
    const altCost   = equityAmt * (altR  / 100) / 12;
    const capCost   = loanCost + altCost;

    /* סה"כ הוצאות */
    const privExpenses = fuelMonthly + maintMonthly + depMonthly + capCost;

    /* ===== שקלול רכב שני וק"מ בונוס ===== */
    const costPerKm = fuelPerKm + mPerKm;   /* עלות ריאלית לק"מ (דלק + בלאי) */

    /* הסטת ק"מ מרכב שני — חיסכון מלא */
    const secondCarMonthKm    = hasSecondCar ? secondCarKmN / 12 : 0;
    const secondCarSaving     = secondCarMonthKm * costPerKm;   /* חיסכון מלא */

    /* ק"מ בונוס ברכב צמוד — שווים חצי מהעלות */
    const bonusMonthKm        = monthKm * (bonusKmPct / 100);
    const bonusValue          = bonusMonthKm * costPerKm * 0.5;  /* חצי ערך */

    const compBonus           = secondCarSaving + bonusValue;    /* יתרון נסתר לצמוד */

    /* מאזן: הכנסות (החזרים בלבד) פחות הוצאות */
    const privNet   = totalAllowNet - privExpenses;

    /* הכרעה — כולל יתרון נסתר לצמוד */
    const adv       = privNet - (-compCost + compBonus);
    const privWins  = adv > 0;
    const maxBar    = Math.max(compCost, privExpenses, totalAllowNet, 200);

    return {
      listN, curValN, showi: shovi, compCost,
      allow676net, allow387net, allow340net, travelNet, totalAllowNet,
      fuelPerKm, fuelMonthly,
      mPerKm, maintMonthly,

      privExpenses, privNet, adv, privWins, maxBar, monthKm,
      costPerKm, secondCarMonthKm, secondCarSaving, bonusMonthKm, bonusValue, compBonus,

function StickyBar() {

    const check = () => {
      const el = document.getElementById('contact-anchor');
      if (el) setVisible(el.getBoundingClientRect().top > window.innerHeight);

    window.addEventListener('scroll', check, {passive: true});
    check();
    return () => window.removeEventListener('scroll', check);
  }, []);
